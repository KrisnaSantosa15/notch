[package]
name = "notch"
version = "0.5.1"
edition = "2021"
authors = ["Krisna Santosa"]
description = "MacBook-like dynamic notch at the top edge of Windows 10/11 screens"
license = "AGPL-3.0-or-later"

[dependencies]
tiny-skia = "0.11"
fontdue = "0.9"
windows-core = "0.58" # required for #[implement] macro
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Data_Json",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Control",
  "Storage_Streams",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
