<!doctype html>
<html><head><meta charset="utf-8"><title>Notch Launch Film</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Notch — launch film. Every pixel is a pure function of time: renderFrame(i) draws frame i.
const W = 1920, H = 1080, FPS = 60, DUR = 22.5, FRAMES = Math.round(DUR * FPS);
const FD = "'Segoe UI Variable Display','Segoe UI',sans-serif";
const FT = "'Segoe UI Variable Text','Segoe UI',sans-serif";
const FM = "'Cascadia Mono',Consolas,monospace";
const S = 2.5;                        // dp -> px on the desktop stage
const ACC = '#55B8FF', MINT = '#4ED6A0', INK = '#F5F5F7', GRAY = 'rgba(245,245,247,0.56)';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const E = {
  lin: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outQuint: t => 1 - Math.pow(1 - t, 5),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function kf(t, keys, ease = E.inOutCubic) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return lerp(v0, v1, (keys[i][2] || ease)((t - t0) / (t1 - t0)));
    }
  }
  return keys[keys.length - 1][1];
}
// Closed-form damped spring step response (0 -> 1).
function spring(t, z = 0.74, ts = 0.5) {
  if (t <= 0) return 0;
  const wn = 4 / (z * ts);
  if (z >= 1) return 1 - Math.exp(-wn * t) * (1 + wn * t);
  const q = Math.sqrt(1 - z * z), wd = wn * q;
  return 1 - Math.exp(-z * wn * t) * (Math.cos(wd * t) + z / q * Math.sin(wd * t));
}
// Superposed springs: each key retargets the value; continuous in t.
function sp(t, keys, z, ts) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * spring(t - keys[i][0], keys[i][2] ?? z, keys[i][3] ?? ts);
  return v;
}
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const vis = (t, a, b, fin = .22, fout = .14, din = .05) =>
  (t < a || t > b) ? 0 : Math.min(E.outCubic(inv(a + din, a + din + fin, t)), 1 - E.inCubic(inv(b - fout, b, t)));

// ---------- canvas helpers ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function font(c, size, weight = 600, fam = FD) { c.font = `${weight} ${size}px ${fam}`; }
function text(c, s, x, y, size, { w = 600, col = INK, al = 'left', fam = FD, ls = 0 } = {}) {
  font(c, size, w, fam); c.textAlign = al; c.textBaseline = 'alphabetic';
  c.fillStyle = col; c.letterSpacing = ls + 'px'; c.fillText(s, x, y); c.letterSpacing = '0px';
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function withLayer(c, a, fn, maxBlur = 9) {
  if (a <= 0.004) return;
  c.save(); c.globalAlpha *= a;
  const b = (1 - a) * maxBlur; if (b > 0.15) c.filter = `blur(${b.toFixed(2)}px)`;
  fn(); c.restore();
}

// Notch outline (same geometry as ui::notch_path): concave "ears" where it meets the top edge.
function notchPath(c, x0, x1, top, h, r, ear, rt = 0) {
  const k = r * (1 - 0.5523);
  c.beginPath();
  if (ear > 0.01) {
    c.moveTo(x0 - ear, top); c.quadraticCurveTo(x0, top, x0, top + ear);
  } else {
    const kt = rt * (1 - 0.5523);
    c.moveTo(x0, top + rt); if (rt > 0) c.bezierCurveTo(x0, top + kt, x0 + kt, top, x0 + rt, top);
    c.lineTo(x1 - rt, top); if (rt > 0) c.bezierCurveTo(x1 - kt, top, x1, top + kt, x1, top + rt);
    c.lineTo(x1, top + h - r); c.bezierCurveTo(x1, top + h - k, x1 - k, top + h, x1 - r, top + h);
    c.lineTo(x0 + r, top + h); c.bezierCurveTo(x0 + k, top + h, x0, top + h - k, x0, top + h - r);
    c.closePath(); return;
  }
  c.lineTo(x0, top + h - r); c.bezierCurveTo(x0, top + h - k, x0 + k, top + h, x0 + r, top + h);
  c.lineTo(x1 - r, top + h); c.bezierCurveTo(x1 - k, top + h, x1, top + h - k, x1, top + h - r);
  c.lineTo(x1, top + ear); c.quadraticCurveTo(x1, top, x1 + ear, top);
  c.closePath();
}

// ---------- pre-rendered assets (deterministic) ----------
const WP = mk(2200, 1240);   // wallpaper, larger than the screen for drift
(function wallpaper() {
  const c = WP.getContext('2d'), w = WP.width, h = WP.height;
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#16336E'); g.addColorStop(.55, '#0B1B40'); g.addColorStop(1, '#050B1C');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const blob = (x, y, r, col, a) => { const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.globalAlpha = a; c.fillStyle = rg; c.fillRect(0, 0, w, h); c.globalAlpha = 1; };
  blob(1500, 260, 1000, '#2F6BFF', .9);
  blob(520, 120, 760, '#3A86FF', .55);
  blob(1820, 820, 700, '#3CC8F0', .45);
  blob(300, 1150, 900, '#0D2B66', .8);
  blob(1100, 1240, 600, '#4ED6A0', .14);
  // silk ribbons, heavily blurred
  const rb = mk(w, h), r = rb.getContext('2d');
  const ribbon = (pts, wid, c0, c1, a) => {
    const lg = r.createLinearGradient(pts[0], pts[1], pts[6], pts[7]); lg.addColorStop(0, c0); lg.addColorStop(1, c1);
    r.globalAlpha = a; r.strokeStyle = lg; r.lineWidth = wid; r.lineCap = 'round';
    r.beginPath(); r.moveTo(pts[0], pts[1]); r.bezierCurveTo(pts[2], pts[3], pts[4], pts[5], pts[6], pts[7]); r.stroke();
  };
  ribbon([-200, 900, 500, 500, 1300, 1150, 2400, 520], 240, '#4D8DFF', '#A9E6FF', .5);
  ribbon([-100, 1100, 700, 760, 1400, 1300, 2300, 820], 70, '#3CC8F0', '#DDF3FF', .55);
  ribbon([200, -100, 900, 380, 1500, 100, 2300, 300], 180, '#5E8FFF', '#9FD8FF', .28);
  c.filter = 'blur(56px)'; c.drawImage(rb, 0, 0); c.filter = 'blur(5px)'; c.globalAlpha = .22; c.drawImage(rb, 0, 0);
  c.globalAlpha = 1; c.filter = 'none';
  const vg = c.createRadialGradient(w / 2, h * .45, h * .3, w / 2, h * .5, h * 1.05); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,4,16,.55)');
  c.fillStyle = vg; c.fillRect(0, 0, w, h);
})();
const WPB = mk(WP.width, WP.height);   // blurred copy for glass
{ const c = WPB.getContext('2d'); c.filter = 'blur(42px)'; c.drawImage(WP, 0, 0); }

const ART = mk(320, 320);   // album art: no text, original
(function art() {
  const c = ART.getContext('2d');
  const g = c.createLinearGradient(0, 0, 320, 320); g.addColorStop(0, '#0B1E52'); g.addColorStop(.6, '#1F5BEA'); g.addColorStop(1, '#4FD3F5');
  c.fillStyle = g; c.fillRect(0, 0, 320, 320);
  const rg = c.createRadialGradient(205, 120, 0, 205, 120, 120); rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(.35, 'rgba(210,245,255,.6)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = rg; c.fillRect(0, 0, 320, 320);
  c.fillStyle = 'rgba(4,10,30,.55)';
  for (let i = 0; i < 9; i++) { const y = 200 + i * 14; c.fillRect(0, y, 320, 4 + i * .9); }
})();

const THUMB = mk(200, 200);   // shelf thumbnail "logo.png"
{ const c = THUMB.getContext('2d'); const g = c.createLinearGradient(0, 200, 200, 0); g.addColorStop(0, '#0E1C3F'); g.addColorStop(1, '#2F6BFF'); c.fillStyle = g; c.fillRect(0, 0, 200, 200);
  c.fillStyle = '#000'; rr(c, 50, 70, 100, 30, 15); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(80, 85, 5, 0, 7); c.arc(120, 85, 5, 0, 7); c.fill(); }

const GRAIN = [0, 1, 2, 3].map(k => {
  const g = mk(256, 256), c = g.getContext('2d'), d = c.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const v = 128 + (hash(i * 1.37 + k * 9173.1) - .5) * 90; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  c.putImageData(d, 0, 0); return g;
});

// ---------- small drawings ----------
function eyes(c, cx, cy, r, gap, open, look, happy, a) {
  for (const ex of [cx - gap, cx + gap]) {
    c.globalAlpha = a * .85; c.fillStyle = 'rgb(24,28,40)'; c.beginPath(); c.arc(ex, cy, r * 2.2, 0, 7); c.fill();
    c.globalAlpha = a * .25; c.fillStyle = 'rgb(90,150,255)'; c.beginPath(); c.arc(ex, cy, r * 2.2, 0, 7); c.fill();
    c.globalAlpha = a * (1 - happy); c.fillStyle = '#fff';
    c.beginPath(); c.ellipse(ex + look, cy, r, Math.max(r * .12, r * open), 0, 0, 7); c.fill();
    if (happy > 0) {   // ^ ^
      c.globalAlpha = a * happy; c.strokeStyle = '#fff'; c.lineWidth = r * .78; c.lineCap = 'round';
      c.beginPath(); c.arc(ex, cy + r * .75, r * 1.05, Math.PI * 1.18, Math.PI * 1.82); c.stroke();
    }
  }
  c.globalAlpha = 1;
}
function bars(c, x, cy, t, n, col, a, scale = 1) {
  for (let i = 0; i < n; i++) {
    const hgt = ((Math.sin(t * 5.5 + i * 1.8) * .5 + .5) * 8 + 3) * S * scale;
    c.globalAlpha = a * .9; c.fillStyle = col; rr(c, x + i * 5.5 * S * scale, cy - hgt / 2, 2.8 * S * scale, hgt, 1.4 * S * scale); c.fill();
  }
  c.globalAlpha = 1;
}
function cursor(c, x, y, s = 1, a = 1) {
  c.save(); c.translate(x, y); c.scale(2.3 * s, 2.3 * s); c.globalAlpha = a;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 17); c.lineTo(4.2, 13.2); c.lineTo(7, 19.6); c.lineTo(9.6, 18.5); c.lineTo(6.9, 12.3); c.lineTo(12.3, 12.3); c.closePath();
  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6; c.shadowOffsetY = 1.5;
  c.fillStyle = '#fff'; c.fill(); c.shadowColor = 'transparent';
  c.lineJoin = 'round'; c.lineWidth = 1.05; c.strokeStyle = '#000'; c.stroke(); c.restore();
}
function docIcon(c, x, y, w, h, a = 1) {
  c.save(); c.globalAlpha *= a;
  c.shadowColor = 'rgba(0,8,30,.45)'; c.shadowBlur = 30; c.shadowOffsetY = 12;
  const f = w * .28;
  c.beginPath(); c.moveTo(x + 14, y); c.lineTo(x + w - f, y); c.lineTo(x + w, y + f); c.lineTo(x + w, y + h - 14); c.quadraticCurveTo(x + w, y + h, x + w - 14, y + h);
  c.lineTo(x + 14, y + h); c.quadraticCurveTo(x, y + h, x, y + h - 14); c.lineTo(x, y + 14); c.quadraticCurveTo(x, y, x + 14, y); c.closePath();
  c.fillStyle = '#FDFDFB'; c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = '#DCE6F5'; c.beginPath(); c.moveTo(x + w - f, y); c.lineTo(x + w - f, y + f); c.lineTo(x + w, y + f); c.closePath(); c.fill();
  c.fillStyle = '#2F6BFF'; rr(c, x + w * .14, y + h * .30, w * .42, h * .085, 4); c.fill();
  c.fillStyle = '#C9D3E2'; for (let i = 0; i < 4; i++) { rr(c, x + w * .14, y + h * (.47 + i * .1), w * (i === 3 ? .45 : .72), h * .045, 3); c.fill(); }
  c.restore();
}
function bell(c, x, y, s, col, rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 1.7; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-6, 4); c.quadraticCurveTo(-5, 2.5, -5, -1); c.quadraticCurveTo(-5, -6.5, 0, -6.8); c.quadraticCurveTo(5, -6.5, 5, -1); c.quadraticCurveTo(5, 2.5, 6, 4); c.closePath(); c.stroke();
  c.beginPath(); c.arc(0, 6.3, 1.5, 0, 7); c.fill(); c.restore();
}

// ---------- notch geometry over the whole desktop section (dp) ----------
const GEO = [  // time, width, height, bottom radius
  [0, 160, 32, 12], [5.75, 300, 32, 12], [6.5, 500, 180, 36], [8.0, 440, 34, 13], [9.5, 230, 32, 12],
  [11.0, 160, 32, 12], [11.55, 380, 130, 32], [12.25, 460, 150, 34], [13.0, 500, 180, 36], [14.32, 320, 32, 12],
];
const SPR = { 11.55: [.52, .62] };   // the magnetic grab is bouncier
function geo(t) {
  const pick = j => GEO.map(g => [g[0], g[j], ...(SPR[g[0]] || [])]);
  return { w: sp(t, pick(1), .76, .5) * S, h: sp(t, pick(2), .76, .5) * S, r: sp(t, pick(3), .8, .5) * S };
}

// ---------- shared notch UI ----------
function tabs(c, x0, x1, sel) {
  const names = ['Music', 'Focus', 'Shelf', 'Tasks']; let x = x0 + 22 * S; const y = 13 * S, hh = 24 * S;
  font(c, 12.5 * S, 600, FT);
  names.forEach((n, i) => {
    const w = c.measureText(n).width + 20 * S;
    if (i === sel) { c.fillStyle = 'rgba(255,255,255,.14)'; rr(c, x, y, w, hh, hh / 2); c.fill(); }
    c.fillStyle = i === sel ? INK : 'rgba(245,245,247,.46)'; c.textAlign = 'left'; c.fillText(n, x + 10 * S, y + 16.6 * S);
    x += w + 3 * S;
  });
  text(c, 'CPU 9%    RAM 41%', x1 - 22 * S, y + 16.4 * S, 10.5 * S, { w: 500, col: 'rgba(245,245,247,.42)', al: 'right', fam: FT });
}
function mmss(s) { s = Math.max(0, s); const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); }

function contentIdle(c, g, t, x0, x1, eyeX) {
  const cy = 16 * S;
  const blink = 1 - kf(t, [[1.75, 0], [1.8, 1], [1.87, 1], [1.95, 0]], E.inOutSine);
  const look = kf(t, [[.8, 0], [.98, -2.6], [1.18, -2.6], [1.34, 2.6], [1.52, 2.6], [1.66, 0]], E.inOutSine) * S
    + kf(t, [[11.0, 0], [11.25, 2.4]], E.inOutSine) * S;
  const open = clamp(sp(t, [[0, 0], [.35, 1]], .7, .35), 0, 1.15) * blink;
  eyes(c, eyeX, cy, 3.2 * S, 8 * S, open, look, 0, 1);
  const ba = clamp(inv(2.95, 3.35, t));
  bars(c, x1 - 14 * S - 2 * 5.5 * S, cy, t, 3, ACC, ba);
}
function contentMusicClosed(c, t, x0, x1) {
  const cy = 16 * S, a = 24 * S;
  c.save(); rr(c, x0 + 7 * S, cy - a / 2, a, a, 7 * S); c.clip(); c.drawImage(ART, x0 + 7 * S, cy - a / 2, a, a); c.restore();
  bars(c, x1 - 14 * S - 3 * 5.5 * S, cy, t * 1.3, 4, ACC, 1);
}
function contentMusicOpen(c, t, x0, x1, h) {
  tabs(c, x0, x1, 0);
  const ax = x0 + 22 * S, ay = 50 * S, as = 92 * S;
  c.save(); c.shadowColor = 'rgba(40,120,255,.45)'; c.shadowBlur = 40; rr(c, ax, ay, as, as, 14 * S); c.fillStyle = '#123'; c.fill(); c.restore();
  c.save(); rr(c, ax, ay, as, as, 14 * S); c.clip(); c.drawImage(ART, ax, ay, as, as); c.restore();
  const tx = ax + as + 16 * S;
  text(c, 'Midnight Drive', tx, 73 * S, 17 * S, { w: 650, fam: FT });
  text(c, 'Lumen', tx, 93 * S, 13 * S, { w: 500, col: GRAY, fam: FT });
  // controls
  const cy = 76 * S; c.fillStyle = INK;
  const tri = (x, dir, s) => { c.beginPath(); c.moveTo(x - dir * s, cy - s); c.lineTo(x + dir * s, cy); c.lineTo(x - dir * s, cy + s); c.closePath(); c.fill(); };
  const px = x1 - 104 * S, nx = x1 - 34 * S, mx = x1 - 69 * S, s = 5.5 * S;
  tri(px - s * .6, -1, s); tri(px + s * .9, -1, s); c.fillRect(px - s * 2.2, cy - s, 1.8 * S, 2 * s);
  tri(nx - s * .9, 1, s); tri(nx + s * .6, 1, s); c.fillRect(nx + s * 2.2 - 1.8 * S, cy - s, 1.8 * S, 2 * s);
  c.fillRect(mx - 4.5 * S, cy - 7 * S, 3.4 * S, 14 * S); c.fillRect(mx + 1.1 * S, cy - 7 * S, 3.4 * S, 14 * S);
  // progress
  const el = 84 + (t - 6.5), p = el / 221, bx = tx, bw = x1 - 22 * S - tx, by = 117 * S;
  c.fillStyle = 'rgba(255,255,255,.16)'; rr(c, bx, by, bw, 5 * S, 2.5 * S); c.fill();
  c.fillStyle = ACC; rr(c, bx, by, bw * p, 5 * S, 2.5 * S); c.fill();
  text(c, mmss(el), bx, 138 * S, 11 * S, { w: 500, col: GRAY, fam: FT });
  text(c, '-' + mmss(221 - el), bx + bw, 138 * S, 11 * S, { w: 500, col: GRAY, al: 'right', fam: FT });
}
const LYR = [
  { a: 8.0, b: 8.9, words: ['City', 'lights', 'in', 'the', 'rear', 'view'] },
  { a: 8.9, b: 9.6, words: ['And', 'the', 'night', 'hums', 'along'] },
];
function contentLyric(c, t, x0, x1) {
  const cy = 17 * S, a = 24 * S;
  c.save(); rr(c, x0 + 7 * S, cy - a / 2, a, a, 7 * S); c.clip(); c.drawImage(ART, x0 + 7 * S, cy - a / 2, a, a); c.restore();
  bars(c, x1 - 14 * S - 3 * 5.5 * S, cy, t * 1.3, 4, ACC, 1);
  const cx = (x0 + x1) / 2 + 4 * S;
  c.save(); c.beginPath(); c.rect(x0 + 36 * S, 0, x1 - x0 - 80 * S, 34 * S); c.clip();
  LYR.forEach((L, li) => {
    const inA = E.outCubic(inv(L.a, L.a + .22, t)), outA = E.inCubic(inv(L.b - .2, L.b, t));
    const al = li === 0 ? 1 - outA : inA * (1 - outA);
    if (al <= 0) return;
    const dy = (li === 0 ? -outA : (1 - inA) - outA) * 14 * S;
    font(c, 13 * S, 650, FT);
    const sp_ = c.measureText(' ').width, ws = L.words.map(w => c.measureText(w).width);
    let x = cx - (ws.reduce((p, q) => p + q, 0) + sp_ * (ws.length - 1)) / 2;
    L.words.forEach((w, i) => {
      const on = E.outCubic(inv(L.a + .1 + i * .11, L.a + .2 + i * .11, t));
      c.globalAlpha = al * (.34 + .66 * on); c.fillStyle = INK; c.textAlign = 'left';
      c.fillText(w, x, cy + 4.6 * S + dy - on * .6 * S); x += ws[i] + sp_;
    });
  });
  c.restore();
}
function rollDigits(c, str0, str1, tc, t, xr, y, size, col) {
  // right-aligned fixed-advance digits; changed digits roll up
  font(c, size, 650, FT); const adv = c.measureText('0').width, colon = c.measureText(':').width;
  const k = E.outCubic(inv(tc, tc + .2, t));
  let x = xr;
  for (let i = str1.length - 1; i >= 0; i--) {
    const ch1 = str1[i], ch0 = str0[i], wch = ch1 === ':' ? colon : adv; x -= wch;
    c.textAlign = 'left'; c.fillStyle = col;
    if (ch0 === ch1 || t < tc) { c.globalAlpha = 1; c.fillText(t < tc ? ch0 : ch1, x, y); }
    else {
      c.save(); c.beginPath(); c.rect(x - 2, y - size, wch + 4, size * 1.25); c.clip();
      c.globalAlpha = 1 - k; c.fillText(ch0, x, y - k * size * .8);
      c.globalAlpha = k; c.fillText(ch1, x, y + (1 - k) * size * .8); c.restore();
    }
  }
  c.globalAlpha = 1;
}
function contentFocus(c, t, x0, x1) {
  const cy = 16 * S, rx = x0 + 18 * S, r = 7.5 * S, p = .04 + inv(9.5, 11, t) * .05;
  c.lineWidth = 2.4 * S; c.strokeStyle = 'rgba(255,255,255,.16)'; c.beginPath(); c.arc(rx, cy, r, 0, 7); c.stroke();

    text(c, 'Notch', 960, 700 + 20 * (1 - k), 168, { w: 700, al: 'center', ls: -6 + 26 * (1 - k) }); c.restore(); }
  const v = E.outExpo(inv(18.95, 19.5, t));
  if (v > 0) { c.save(); c.globalAlpha = v; text(c, 'For Windows 10 and 11.', 960, 778 + (1 - v) * 18, 44, { w: 600, col: '#8A8A90', al: 'center', ls: -.4 }); c.restore(); }
  const q = E.outExpo(inv(19.35, 19.95, t));
  if (q > 0) {
    c.save(); c.globalAlpha = q; font(c, 30, 400, FM); const s = 'winget install KrisnaSantosa15.notch', tw = c.measureText(s).width;
    const y = 860 + (1 - q) * 16;
    c.fillStyle = '#0E0F12'; rr(c, 960 - tw / 2 - 28, y - 32, tw + 56, 64, 32); c.fill();
    c.strokeStyle = '#26282E'; c.lineWidth = 1.5; rr(c, 960 - tw / 2 - 28, y - 32, tw + 56, 64, 32); c.stroke();
    text(c, s, 960, y + 10, 30, { w: 400, col: '#C7CBD3', al: 'center', fam: FM }); c.restore();
  }

}
function draw(c, t) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.filter = 'none';
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  if (t < 4) introScene(c, t);
  else if (t < 5.5) meetCard(c, t);
  else if (t < 15) desktopScene(c, t);
  else if (t < 18) specScene(c, t);
  else if (t < 21.8) endScene(c, t);
}

// ---------- frame output: 4-sample shutter (180°), never straddling a cut ----------
const CUTS = [4, 5.5, 15, 16, 17, 18, 21.8];
const main = document.getElementById('c'), M = main.getContext('2d');
const LAY = mk(W, H), L = LAY.getContext('2d');
window.renderFrame = function (i, samples = 4) {
  const t0 = i / FPS;
  M.setTransform(1, 0, 0, 1, 0, 0); M.globalAlpha = 1; M.globalCompositeOperation = 'source-over';
  for (let k = 0; k < samples; k++) {
    let t = t0 + (k / samples) * (.5 / FPS);
    if (CUTS.some(cu => t0 < cu && t >= cu)) t = t0;
    draw(L, t);
    M.globalAlpha = 1 / (k + 1); M.drawImage(LAY, 0, 0);
  }
  M.globalAlpha = .055; M.globalCompositeOperation = 'overlay';
  const g = GRAIN[i % 4], ox = Math.floor(hash(i) * 256), oy = Math.floor(hash(i + 7) * 256);
  M.fillStyle = M.createPattern(g, 'repeat'); M.save(); M.translate(-ox, -oy); M.fillRect(0, 0, W + 256, H + 256); M.restore();
  M.globalAlpha = 1; M.globalCompositeOperation = 'source-over';
};
window.FRAMES = FRAMES;
window.ready = Promise.all([
  document.fonts.load(`700 100px ${FD}`), document.fonts.load(`600 40px ${FT}`), document.fonts.load(`400 30px ${FM}`),
]).then(() => { const q = new URLSearchParams(location.search); if (q.has('t')) renderFrame(Math.round(+q.get('t') * FPS)); return true; });
