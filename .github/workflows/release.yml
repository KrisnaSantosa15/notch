name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package release assets
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/notch.exe -DestinationPath notch-windows-x86_64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notch-windows-x86_64.zip
            winget/KrisnaSantosa15.notch.yaml
          generate_release_notes: true
