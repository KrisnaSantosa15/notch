name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "Tag version ($tag) does not match Cargo.toml version ($cargo)"
            exit 1
          }

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release assets
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/notch.exe -DestinationPath notch-windows-x86_64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: notch-windows-x86_64.zip
          generate_release_notes: true
